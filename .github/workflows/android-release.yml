name: Android release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        shell: bash
        run: |
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' android/buildozer.spec)"
          if [[ -z "$version" || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match version $version in android/buildozer.spec." >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git zip unzip python3-venv python3-dev autoconf automake libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libsqlite3-dev libbz2-dev liblzma-dev libltdl-dev ccache patch curl
          python3 -m venv "$RUNNER_TEMP/buildozer-venv"
          "$RUNNER_TEMP/buildozer-venv/bin/pip" install buildozer==1.6.0 cython==0.29.37 setuptools wheel
          echo "$RUNNER_TEMP/buildozer-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/buildozer-venv" >> "$GITHUB_ENV"

      - name: Prepare Android SDK
        run: |
          test -s "$ANDROID_HOME/licenses/android-sdk-license"
          sdk="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$sdk/licenses"
          curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-6514223_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$sdk"
          test -x "$sdk/tools/bin/sdkmanager"
          cp "$ANDROID_HOME/licenses/android-sdk-license" "$sdk/licenses/"

      - name: Prepare upload key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$P4A_RELEASE_KEYALIAS" || -z "$P4A_RELEASE_KEYSTORE_PASSWD" || -z "$P4A_RELEASE_KEYALIAS_PASSWD" ]]; then
            echo "::warning::One or more Android signing secrets are missing; releasing the debug APK only."
            echo "enabled=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-upload-key"
          keytool -list -keystore "$RUNNER_TEMP/android-upload-key" \
            -storepass:env P4A_RELEASE_KEYSTORE_PASSWD -alias "$P4A_RELEASE_KEYALIAS" > /dev/null
          echo "enabled=1" >> "$GITHUB_OUTPUT"

      - name: Build APK and signed AAB
        env:
          APK_OUTPUT_DIR: ${{ runner.temp }}/maze-apk
          AAB_OUTPUT_DIR: ${{ runner.temp }}/maze-aab
          BUILD_RELEASE_AAB: ${{ steps.signing.outputs.enabled }}
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/android-upload-key
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash android/build_apk.sh

      - name: Verify APK
        shell: bash
        run: |
          shopt -s nullglob
          apks=("$RUNNER_TEMP"/maze-apk/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "Expected exactly one APK, found ${#apks[@]}." >&2
            exit 1
          fi
          tools="$HOME/.buildozer/android/platform/android-sdk/build-tools"
          aapt="$(find "$tools" -name aapt -type f | sort -V | tail -n 1)"
          signer="$(dirname "$aapt")/apksigner"
          "$aapt" dump badging "${apks[0]}" | grep -Fx "targetSdkVersion:'36'"
          "$signer" verify "${apks[0]}"

      - name: Verify signed AAB
        if: steps.signing.outputs.enabled == '1'
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/maze-aab/*.aab)
          if (( ${#bundles[@]} != 1 )); then
            echo "Expected exactly one AAB, found ${#bundles[@]}." >&2
            exit 1
          fi
          jarsigner -verify -strict -keystore "$RUNNER_TEMP/android-upload-key" \
            -storepass:env P4A_RELEASE_KEYSTORE_PASSWD "${bundles[0]}" "$P4A_RELEASE_KEYALIAS"
          curl -fsSL --retry 3 https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="${bundles[0]}"
          version="$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="${bundles[0]}" --xpath=/manifest/@android:versionName)"
          target="$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="${bundles[0]}" --xpath=/manifest/uses-sdk/@android:targetSdkVersion)"
          debuggable="$(java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="${bundles[0]}" --xpath=/manifest/application/@android:debuggable)"
          if [[ "$version" != "${GITHUB_REF_NAME#v}" || "$target" != 36 || ( -n "$debuggable" && "$debuggable" != false ) ]]; then
            echo "AAB version, target SDK or debuggable flag is incorrect." >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("$RUNNER_TEMP"/maze-apk/*.apk)
          notes="The APK is a debug build and may require uninstalling an older build."
          if [[ "${{ steps.signing.outputs.enabled }}" == 1 ]]; then
            assets+=("$RUNNER_TEMP"/maze-aab/*.aab)
            notes="$notes The signed AAB is intended for Google Play."
          fi
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$notes"

      - name: Remove upload key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/android-upload-key"
